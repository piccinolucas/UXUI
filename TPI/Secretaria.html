<!doctype html>
<html lang="es" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Consultorio Odontológico — Secretaría</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="comun.css">
  <style>
/* recorrido de decisiones de recepción (replica el diagrama de flujo de Miro) */
.dtrack{display:flex;flex-direction:column}
.dstep{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding-bottom:16px;position:relative}
.dstep::before{content:"";position:absolute;inset-inline-start:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.dstep:last-child::before{display:none}
.dstep .q{width:28px;height:28px;border-radius:8px;transform:rotate(45deg) scale(.78);display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line-strong)}
.dstep .q span{transform:rotate(-45deg);font-size:.7rem;font-weight:700}
.dstep.yes .q{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.dstep.no .q{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.dstep.cur .q{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:960px){.cols3{grid-template-columns:1fr}}
.colh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  </style>
</head>
<body>
<div id="app"></div>
<script src="comun.js"></script>
<script>
/* ---------- estado ---------- */
let S;
const emptyRec=()=>({q:'',pac:null,res:null,val:null});
const STAFF=[{dni:'28455120',pass:'Demo1234',nombre:'Ana Ríos',rol:'Recepción'},{dni:'33102877',pass:'Demo1234',nombre:'Julián Ferrero',rol:'Recepción'}];
function reset(){S={...seed(),view:'s.login',login:{},sUser:null,toast:null,modal:null,rec:emptyRec(),reg:null,offer:null,close:null,pfilter:'',viewPac:null,err:{},focusId:null}}
reset();
const app=$('app');

function renderView(){app.innerHTML=`${S.view==='s.login'?sLogin():vStaff()}${vModal()}${toastHTML()}`}

function vModal(){
  const m=S.modal;if(!m)return '';
  if(m.type==='kbd')return modalWrap(kbdModal());
  if(m.type==='wa')return modalWrap(`<div class="row between"><h2 id="dlg-t">Mensaje enviado por WhatsApp</h2><button class="btn sm" data-a="close-modal">Cerrar</button></div>
      <p class="muted small">Destino: ${ltr(`<span class="mono">${esc(m.msg.to)}</span>`)}</p>${waBox(m.msg)}`);
  return '';
}

/* ---------- shell ---------- */
const NAV=()=>[['s.reception','Recepción',I.door],['s.queue','Sala de espera',I.queue,S.cola.filter(c=>c.estado!=='finalizado').length],['s.patients','Pacientes',I.users],['s.agenda','Agenda',I.cal]];
function vStaff(){
  const v=S.view,sec={'s.register':S.reg?.from||'s.patients','s.patient':'s.patients','s.close':'s.queue'}[v]||v;
  const views={'s.reception':sReception,'s.queue':sQueue,'s.patients':sPatients,'s.patient':sPatient,'s.register':sRegister,'s.agenda':agenda,'s.close':sClose};
  return `<div class="swrap"><div class="sshell"><aside class="side">${brand('Recepción')}
    <nav aria-label="Secciones">${NAV().map(([k,l,ic,b])=>`<button data-a="nav" data-v="${k}" ${sec===k?'aria-current="page"':''}>${ic}${l}${b?`<span class="badge" aria-label="${b} en la sala de espera">${b}</span>`:''}</button>`).join('')}</nav>
    <div class="who"><div class="me"><span class="avatar" aria-hidden="true">${initials(S.sUser.nombre)}</span><div style="min-width:0"><b class="small">${esc(S.sUser.nombre)}</b><br><span class="muted small">${esc(S.sUser.rol)}</span></div></div>
      <button class="link small" data-a="kbd-help">${I.kbd} Atajos de teclado</button>
      <button class="btn sm" data-a="logout">${I.out} Cerrar sesión</button></div>
  </aside><main class="main" id="contenido" tabindex="-1"><div class="main-in">${(views[v]||(()=>''))()}</div></main></div></div>`;
}

function sLogin(){return staffLogin({sub:'Recepción',title:'Ingreso de secretaría',lead:'Ingresá con tu DNI y tu contraseña para gestionar pacientes y turnos.',users:STAFF})}

/* ---------- datos visibles para recepción: personales, contacto, cobertura y turnos.
   Los datos clínicos (antecedentes, diagnósticos, notas) solo los ve el profesional. ---------- */
function patientAdmin(p){
  const nt=nextTurnoOf(p.id),visits=S.hc.filter(h=>h.pac===p.id).length;
  return `<div class="grid2">
    <div class="card stack"><h2>Datos personales y contacto</h2>
      <div class="kv"><div><span class="k">DNI</span>${ltr(`<span class="mono">${p.dni}</span>`)}</div><div><span class="k">Edad</span>${age(p.nac)} años</div><div><span class="k">Teléfono</span>${ltr(`<span class="mono">${esc(p.tel)}</span>`)}</div><div><span class="k">Correo</span>${esc(p.email||'—')}</div><div><span class="k">Domicilio</span>${esc(p.dom||'—')}</div><div><span class="k">Ocupación</span>${esc(p.ocup||'—')}</div></div></div>
    <div class="card stack"><h2>Cobertura</h2><div class="kv"><div><span class="k">Obra social</span>${esc(p.os)}</div><div><span class="k">N° de afiliado</span><span class="mono">${esc(p.afil||'—')}</span></div></div></div>
    <div class="card stack"><h2>Próximo turno</h2>${nt?`<p><b>${fmtLong(nt.fecha)} · ${nt.hora} h</b><br><span class="muted small">${prof(nt.prof).nombre} · ${esc(nt.tipo)} · <span class="mono">${nt.id}</span></span></p>`:'<p class="muted">Sin turnos pendientes</p>'}</div>
    <div class="card stack"><h2>Ficha de salud</h2>
      ${p.anam?`<p><span class="pill ok">${I.check} Completa</span></p>`:`<p><span class="pill warn">${I.warn} Pendiente</span></p><p class="small">El paciente la completa desde su portal antes de la primera consulta.</p><div><button class="btn sm" data-a="s-remind" data-id="${p.id}">${I.msg} Recordárselo por WhatsApp</button></div>`}
      <p class="muted small">${visits} atenciones registradas. Por confidencialidad, el contenido de la historia clínica solo lo ve el profesional.</p></div>
  </div>`;
}

/* ---------- ofrecer turnos: calendario con cantidad de turnos libres por día ---------- */
function offerPanel(){
  const o=S.offer,p=pac(o.pac);
  if(o.result){const t=turno(o.result),m=S.wa.filter(x=>x.pac===p.id).slice(-1)[0];
    return `<div class="grid2"><div class="stack"><span class="pill ok" style="align-self:flex-start">${I.check} Turno asignado</span><h2>${fmtLong(t.fecha)} · ${t.hora} h</h2><p class="muted">${prof(t.prof).nombre} · ${esc(t.tipo)} · código <span class="mono">${t.id}</span></p>
      <p class="small muted">Constancia enviada a ${ltr(`<span class="mono">${esc(p.tel)}</span>`)}</p>
      <div><button class="btn pri" data-a="offer-finish">Finalizar</button></div></div>${m?waBox(m):''}</div>`;}
  if(o.ended) return `<div class="alert warn">${I.warn}<div><b>Sin turno asignado</b><p>${esc(p.nombre)} no aceptó ningún horario. Puede pedirlo más adelante desde su portal.</p></div></div><div><button class="btn pri" data-a="offer-finish">Finalizar</button></div>`;
  const sl=o.fecha?slotsFor(o.prof,o.fecha):[];
  return `<div class="stack lg">
    <div><h2>Dar turno a ${esc(p.nombre)}</h2><p class="muted small">Elegí con el paciente el profesional, el día y el horario.</p></div>
    <div class="grid2">${fld({id:'of-prof',label:'Profesional',opts:PROFS.map(x=>[x.id,`${x.nombre} · ${x.esp}`]),value:o.prof})}${fld({id:'of-tipo',label:'Tipo de atención',opts:prof(o.prof).tipos,value:o.tipo})}</div>
    <div class="book-grid">
      <div class="card flat stack">${calendar({month:o.month,prof:o.prof,sel:o.fecha,dayAction:'of-day',monthAction:'of-month',canPrev:canPrevMonth(o.month)})}</div>
      <div class="card flat stack">
        <div><h3>Horarios</h3><p class="muted small">${o.fecha?`${fmtLong(o.fecha)} · ${sl.length} ${sl.length===1?'turno libre':'turnos libres'}`:'Primero elegí un día en el calendario'}</p></div>
        ${o.fecha?`<div class="slots" role="group" aria-label="Horarios del ${esc(fmtLong(o.fecha))}">${sl.map(t=>`<button data-a="of-hora" data-h="${t}" aria-pressed="${o.hora===t}">${t}</button>`).join('')}</div>`:''}
        ${o.hora?`<div class="alert info">${I.cal}<div><b>${fmtLong(o.fecha)} · ${o.hora} h</b><p>${prof(o.prof).nombre} · ${esc(o.tipo)}</p></div></div>`:''}
        <button class="btn pri block" data-a="offer-accept" ${o.hora?'':'disabled'}>Asignar turno y enviar constancia</button>
        ${!o.hora?'<p class="hint">El botón se habilita cuando elegís un horario.</p>':''}
        <button class="btn block" data-a="offer-stop">El paciente no acepta ningún horario</button>
      </div></div></div>`;
}
function startOffer(pid,ctx,profId='L'){S.offer={pac:pid,ctx,prof:profId,tipo:prof(profId).tipos[0],month:monthStart(parse(TODAY)),fecha:null,hora:null}}

/* ---------- recepción ---------- */
function sReception(){
  const r=S.rec;let res='';
  if(r.res){
    const p=r.pac&&pac(r.pac);
    const step=(cls,label,content)=>`<div class="dstep ${cls}"><span class="q" aria-hidden="true"><span>${cls==='yes'?'SÍ':cls==='no'?'NO':'?'}</span></span><div class="stack" style="gap:6px;padding-top:3px"><b>${label} <span class="sr-only">${cls==='yes'?'Sí':cls==='no'?'No':'Paso actual'}</span></b>${content||''}</div></div>`;
    let steps='';
    if(r.res==='nf'){
      steps=step('no','¿Está registrado?',`<p class="muted">No hay ningún paciente con "${esc(r.q)}".</p><div><button class="btn pri" data-a="s-goreg" data-from="s.reception">Registrar al paciente ${I.arrow}</button></div>`);
    } else {
      const t=nextTurnoOf(p.id),c=colaOf(p.id);
      steps=step('yes','¿Está registrado?',`<div class="lrow"><span class="avatar" aria-hidden="true">${initials(p.nombre.split(',').reverse().join(' '))}</span><div class="grow"><b>${esc(p.nombre)}</b><br><span class="muted small"><span class="mono">${p.hc}</span> · DNI <span class="mono">${p.dni}</span> · ${esc(p.os)}</span></div>${!p.anam?'<span class="pill warn">Ficha de salud pendiente</span>':''}<button class="btn sm" data-a="s-open" data-id="${p.id}" aria-label="Ver la ficha de ${esc(p.nombre)}">Ver ficha</button></div>`);
      if(c){
        steps+=step('yes','¿Tiene turno?',`<div class="alert info">${I.queue}<div><b>Ya está en la sala de espera</b><p>${c.estado==='atendiendo'?'Está siendo atendido.':`Posición ${queuePos(c).pos} con ${prof(c.prof).nombre}.`}</p></div></div><div><button class="btn" data-a="s-clear">Atender a otra persona</button></div>`);
      } else if(!t){
        steps+=step('no','¿Tiene turno?',`<p class="muted">No tiene turnos pendientes.</p>${S.offer&&S.offer.ctx==='s'?'':`<div><button class="btn pri" data-a="s-offer">Ofrecer turnos disponibles ${I.arrow}</button></div>`}`);
      } else {
        steps+=step('yes','¿Tiene turno?',`<p><b>${fmtLong(t.fecha)} · ${t.hora} h</b> <span class="muted">· ${prof(t.prof).nombre} · ${esc(t.tipo)} · <span class="mono">${t.id}</span></span></p>`);
        if(!r.val){steps+=step('cur','Validar turno',`<p class="muted small">Se controla fecha, estado y profesional del turno.</p><div><button class="btn pri" data-a="s-validate">Validar turno</button></div>`);}
        else if(r.val.ok){
          steps+=step('yes','¿Es válido?',`<div class="alert ok">${I.check}<div><b>Turno válido</b><p>${esc(r.val.msg)}</p></div></div>`);
          steps+=step('cur','Agregar a la sala de espera',`<div class="row"><button class="btn pri" data-a="s-addq">Agregar a la sala de espera de ${esc(prof(t.prof).nombre)}</button><label class="check small"><input type="checkbox" id="rc-wa" checked> Avisarle por WhatsApp</label></div>`);
        } else {
          steps+=step('no','¿Es válido?',`<div class="alert">${I.warn}<div><b>Turno no válido</b><p>${esc(r.val.msg)}</p></div></div>`);
          steps+=step(r.informed?'yes':'cur','Informar la situación',r.informed?`<p class="muted">Situación informada al paciente.</p><div><button class="btn" data-a="s-clear">Atender a otra persona</button></div>`
            :`<div class="card flat" style="padding:12px;background:var(--surface-2)"><span class="eyebrow">Qué decirle</span><p>"${esc(r.val.script)}"</p></div><div><button class="btn pri" data-a="s-inform">Situación informada</button></div>`);
        }
      }
    }
    res=`<div class="card raised"><div class="dtrack">${steps}</div></div>${S.offer&&S.offer.ctx==='s'?`<div class="card raised">${offerPanel()}</div>`:''}`;
  }
  const exp=S.turnos.filter(t=>t.fecha===TODAY&&t.estado==='confirmado'&&!colaOf(t.pac)).sort((a,b)=>a.hora.localeCompare(b.hora));
  return `<div class="phead"><div><h1>Recepción</h1><p>Buscá a la persona que llegó para validar su turno o darle uno.</p></div>
    <button class="btn pri" data-a="s-goreg" data-from="s.reception">${I.plus} Registrar paciente nuevo</button></div>
  <form class="card stack" data-form="s-search" data-validate="no" role="search" novalidate>
    <div class="field"><label for="rc-q">Nombre o DNI del paciente</label>
      <div class="row" style="flex-wrap:nowrap"><input class="input" id="rc-q" value="${esc(r.q)}" placeholder="Ej.: Juan Carlos o 38647762" autocomplete="off"><button class="btn pri" type="submit">${I.search} Buscar</button></div></div>
    <div class="stack" style="gap:6px"><span class="hint">Datos de prueba (solo demo):</span><div class="chips">${['44122123','35012987','41888999','27999555'].map(d=>`<button type="button" class="chip" data-a="s-try" data-val="${d}" aria-label="Buscar el DNI ${d}"><span class="mono">${d}</span></button>`).join('')}</div></div>
  </form>
  ${res}
  ${!r.res?`<div class="card stack"><div class="row between"><h2>Esperados hoy</h2><span class="muted small">Turnos confirmados que todavía no llegaron</span></div>
    ${exp.length?`<div class="list">${exp.map(t=>`<div class="lrow click" role="button" tabindex="0" data-a="s-try" data-val="${pac(t.pac).dni}" aria-label="Recibir a ${esc(pac(t.pac).nombre)}, turno de las ${t.hora}"><span class="mono">${t.hora}</span><div class="grow"><b>${esc(pac(t.pac).nombre)}</b><br><span class="muted small">${prof(t.prof).nombre} · ${esc(t.tipo)}</span></div><span class="link" aria-hidden="true">Recibir ${I.arrow}</span></div>`).join('')}</div>`:'<p class="muted">Todos los pacientes del día ya llegaron.</p>'}</div>`:''}`;
}

/* ---------- alta de paciente: solo datos personales y cobertura ---------- */
function sRegister(){
  const g=S.reg,d=g.d,from=g.from||'s.patients';
  return `${crumbs([{label:from==='s.reception'?'Recepción':'Pacientes',v:from},{label:'Registrar paciente'}])}
  <div class="phead"><div><h1>Registrar paciente</h1><p>Datos personales y cobertura. La ficha de salud la completa el paciente desde su portal.</p></div></div>
  <form class="card raised stack lg" data-form="s-reg" novalidate>
    ${errSummary()}
    <div class="field" style="max-width:260px"><span class="lbl">N° de historia clínica</span><div class="static mono">Se asigna al guardar</div></div>
    <div class="grid2">
      ${fld({id:'sr-ape',label:'Apellidos',req:true,value:d.ape,ph:'Ej.: Saccone',auto:'family-name'})}
      ${fld({id:'sr-nom',label:'Nombres',req:true,value:d.nom,ph:'Ej.: Facundo',auto:'given-name'})}
      ${fld({id:'sr-dni',label:'DNI',req:true,rule:'dni',mono:true,mode:'numeric',value:d.dni,hint:'Solo números, sin puntos.'})}
      ${fld({id:'sr-nac',label:'Fecha de nacimiento',req:true,rule:'date',type:'date',value:d.nac})}
      ${fld({id:'sr-tel',label:'Teléfono / WhatsApp',req:true,rule:'tel',mono:true,mode:'tel',value:d.tel??'+54 9 351 ',hint:'Con código de área. Ahí le llegan los avisos.'})}
      ${fld({id:'sr-email',label:'Correo electrónico',rule:'email',type:'email',value:d.email,ph:'paciente@correo.com',ltr:true})}
    </div>
    <hr class="hr"><h2>Cobertura médica</h2>
    <div class="grid3">
      ${fld({id:'sr-os',label:'Obra social',opts:OBRAS,value:d.os})}
      ${fld({id:'sr-afil',label:'N° de afiliado',mono:true,value:d.afil})}
      ${fld({id:'sr-plan',label:'Plan',value:d.plan,ph:'Ej.: 210'})}
    </div>
    <hr class="hr">
    <div class="stack" style="gap:6px">
      <label class="check" for="sr-ok"><input type="checkbox" id="sr-ok" data-req="1" aria-describedby="sr-ok-err" ${d.ok?'checked':''} ${S.err['sr-ok']?'aria-invalid="true"':''}><span><b>El paciente fue informado sobre el uso de sus datos y lo acepta</b> <span class="req" aria-hidden="true">*</span></span></label>
      <details class="more"><summary>Qué le informamos al paciente</summary><p>Usamos sus datos solo para gestionar turnos, la cobertura y su historia clínica en este consultorio. No se comparten con terceros, salvo con su obra social para autorizar prácticas. Los datos de salud solo los ve el profesional que lo atiende. Puede pedir verlos, corregirlos o darse de baja cuando quiera (Ley 25.326).</p></details>
      <p class="err ${S.err['sr-ok']?'on':''}" id="sr-ok-err">${S.err['sr-ok']?I.warn+esc(S.err['sr-ok']):''}</p>
    </div>
    <div class="row between"><button class="btn" type="button" data-a="nav" data-v="${from}">Cancelar</button><button class="btn pri" type="submit">Registrar paciente ${I.check}</button></div>
  </form>`;
}

/* ---------- sala de espera ---------- */
function sQueue(){
  const all=S.cola.filter(c=>c.estado!=='finalizado');
  const col=(title,items,empty,fn)=>`<section class="card stack" aria-label="${esc(title)}"><div class="colh"><h2>${title}</h2><span class="pill">${items.length}</span></div>${items.length?`<div class="list">${items.map(fn).join('')}</div>`:`<p class="muted small">${empty}</p>`}</section>`;
  const esperando=PROFS.flatMap(pr=>S.cola.filter(c=>c.prof===pr.id&&c.estado==='espera'));
  return `<div class="phead"><div><h1>Sala de espera</h1><p>${cap(fmtLong(TODAY))} · estado de los consultorios</p></div><button class="btn pri" data-a="nav" data-v="s.reception">${I.plus} Recibir paciente</button></div>
  <div class="cols3">
    ${col('En espera',esperando,'Nadie esperando.',c=>{const p=pac(c.pac),{pos,wait}=queuePos(c);return `<div class="lrow"><span class="pos" aria-label="Posición ${pos}">${pos}</span><div class="grow"><b>${esc(p.nombre)}</b><br><span class="muted small">${prof(c.prof).nombre}<br>Llegó ${c.llegada} · ~${wait} min</span></div></div>`})}
    ${col('En atención',all.filter(c=>c.estado==='atendiendo'),'Ningún consultorio ocupado.',c=>{const p=pac(c.pac);return `<div class="lrow hl"><div class="grow"><b>${esc(p.nombre)}</b> <span class="pill ok">En atención</span><br><span class="muted small">${prof(c.prof).nombre} · ${prof(c.prof).box}</span></div></div>`})}
    ${col('Atendidos · falta el cierre',S.salida,'Cuando un profesional finaliza una atención, aparece acá para el cierre administrativo.',s=>{const p=pac(s.pac);return `<div class="lrow"><div class="grow"><b>${esc(p.nombre)}</b><br><span class="muted small">${prof(s.prof).nombre} · salió ${s.salida} h${s.turnoNuevo?' · ya tiene turno nuevo':''}</span></div><button class="btn pri sm" data-a="s-close" data-id="${s.id}" aria-label="Cerrar la atención de ${esc(p.nombre)}">Cerrar</button></div>`})}
  </div>`;
}

function sClose(){
  const k=S.close,s=S.salida.find(x=>x.id===k.id)||k.snap,p=pac(s.pac);
  let body='';
  if(k.stage==='admin'){
    body=`<form class="card raised stack" data-form="cl-save" novalidate><h2>Cierre administrativo</h2>
      <div class="alert info">${I.check}<div><b>Atención registrada por ${esc(prof(s.prof).nombre)}</b><p>Salió a las ${s.salida} h. El detalle clínico queda en la historia clínica y solo lo ve el profesional.</p></div></div>
      <div class="grid2">${fld({id:'cl-os',label:'Cobertura de la práctica',opts:[p.os,...(p.os==='Particular / Sin obra social'?[]:['Particular / Sin obra social'])],value:p.os})}
      ${fld({id:'cl-cod',label:'Código de prestación',req:true,mono:true,value:'01.01'})}</div>
      ${fld({id:'cl-obs',label:'Observaciones administrativas',area:true,ph:'Ej.: abonó coseguro, falta orden firmada'})}
      <div class="row" style="justify-content:flex-end"><button class="btn pri" type="submit">Registrar y continuar ${I.arrow}</button></div></form>`;
  } else if(k.stage==='need'){
    body=`<div class="card raised stack"><h2>¿Necesita otro turno?</h2>${s.turnoNuevo?`<div class="alert info">${I.cal}<div><b>El profesional ya le dio un turno</b><p>${esc(s.turnoNuevo)}</p></div></div>`:''}
      <div class="row"><button class="btn pri" data-a="cl-need" data-v="1">Sí, ofrecer turnos</button><button class="btn" data-a="cl-need" data-v="0">No, finalizar</button></div></div>`;
  } else body=`<div class="card raised">${offerPanel()}</div>`;
  return `${crumbs([{label:'Sala de espera',v:'s.queue'},{label:`Cierre de atención · ${p.nombre}`}])}
  <div class="phead"><div><h1>Cierre de atención</h1><p>${esc(p.nombre)} · ${prof(s.prof).nombre}</p></div>
    <ol class="steps" aria-label="Pasos del cierre"><li class="st done"><b aria-hidden="true">✓</b>Salida</li><li class="sep" aria-hidden="true"></li><li class="st ${k.stage==='admin'?'on':'done'}" ${k.stage==='admin'?'aria-current="step"':''}><b aria-hidden="true">${k.stage==='admin'?2:'✓'}</b>Cierre administrativo</li><li class="sep" aria-hidden="true"></li><li class="st ${k.stage!=='admin'?'on':''}" ${k.stage!=='admin'?'aria-current="step"':''}><b aria-hidden="true">3</b>Otro turno</li></ol></div>
  ${body}`;
}

/* ---------- pacientes ---------- */
function sPatients(){
  const q=S.pfilter.toLowerCase(),l=S.patients.filter(p=>!q||p.nombre.toLowerCase().includes(q)||p.dni.includes(q));
  return `<div class="phead"><div><h1>Pacientes</h1><p>${S.patients.length} pacientes registrados</p></div><button class="btn pri" data-a="s-goreg" data-from="s.patients">${I.plus} Registrar paciente nuevo</button></div>
  <div class="card" role="search"><div class="field"><label for="pf-q">Buscar por nombre o DNI</label><input class="input" id="pf-q" data-input="pfilter" value="${esc(S.pfilter)}" placeholder="Ej.: Juan Carlos o 38647762" autocomplete="off"></div></div>
  <p class="sr-only" aria-live="polite">${l.length} resultados</p>
  <div class="list">${l.map(p=>{const t=nextTurnoOf(p.id);return `<div class="lrow click" role="button" tabindex="0" data-a="s-open" data-id="${p.id}" aria-label="Ver la ficha de ${esc(p.nombre)}"><span class="avatar" aria-hidden="true">${initials(p.nombre.split(',').reverse().join(' '))}</span><div class="grow"><b>${esc(p.nombre)}</b><br><span class="muted small"><span class="mono">${p.hc}</span> · DNI <span class="mono">${p.dni}</span> · ${esc(p.os)}</span></div>${!p.anam?'<span class="pill warn">Ficha de salud pendiente</span>':''}${t?`<span class="pill ok">Turno ${fmtShort(t.fecha)}</span>`:'<span class="pill">Sin turno</span>'}${I.arrow}</div>`}).join('')||'<p class="muted">Sin resultados.</p>'}</div>`;
}

function sPatient(){
  const p=pac(S.viewPac);
  return `${crumbs([{label:'Pacientes',v:'s.patients'},{label:p.nombre}])}
  <div class="phead"><div><h1>${esc(p.nombre)}</h1><p><span class="mono">${p.hc}</span> · DNI <span class="mono">${p.dni}</span> · ${age(p.nac)} años</p></div>
    <div class="row"><button class="btn pri" data-a="s-offer-for" data-id="${p.id}">${I.cal} Dar turno</button></div></div>
  ${S.offer&&S.offer.ctx==='sp'&&S.offer.pac===p.id?`<div class="card raised">${offerPanel()}</div>`:''}
  ${patientAdmin(p)}`;
}

function agenda(){
  const l=S.turnos.filter(t=>t.fecha===TODAY&&t.estado!=='cancelado').sort((a,b)=>a.hora.localeCompare(b.hora));
  const st=t=>{const c=S.cola.find(x=>x.turno===t.id);if(t.estado==='atendido')return '<span class="pill ok">Atendido</span>';if(c?.estado==='atendiendo')return '<span class="pill acc">En atención</span>';if(c?.estado==='espera')return '<span class="pill warn">En sala de espera</span>';return '<span class="pill">Pendiente</span>'};
  const up=S.turnos.filter(t=>t.fecha>TODAY&&t.estado==='confirmado').sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora)).slice(0,8);
  const rows=(arr,c1)=>arr.map(t=>`<tr><td class="num mono" data-label="${c1}">${t.fecha===TODAY?t.hora:fmtShort(t.fecha)+' '+t.hora}</td><td data-label="Paciente"><b>${esc(pac(t.pac).nombre)}</b><br><span class="muted small">DNI <span class="mono">${pac(t.pac).dni}</span></span></td><td data-label="Profesional">${prof(t.prof).nombre}</td><td data-label="Atención">${esc(t.tipo)}</td><td class="mono" data-label="Código">${t.id}</td><td data-label="Estado">${t.fecha===TODAY?st(t):'<span class="pill ok">Confirmado</span>'}</td></tr>`).join('');
  return `<div class="phead"><div><h1>Agenda</h1><p>${cap(fmtLong(TODAY))} · todos los consultorios</p></div><button class="btn pri" data-a="nav" data-v="s.patients">${I.cal} Dar turno a un paciente</button></div>
  <h2>Hoy</h2>
  <div class="tbl-wrap"><table><thead><tr><th>Hora</th><th>Paciente</th><th>Profesional</th><th>Atención</th><th>Código</th><th>Estado</th></tr></thead><tbody>${rows(l,'Hora')||'<tr><td colspan="6" data-label="" class="muted">Sin turnos hoy.</td></tr>'}</tbody></table></div>
  <h2>Próximos días</h2>
  <div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th>Paciente</th><th>Profesional</th><th>Atención</th><th>Código</th><th>Estado</th></tr></thead><tbody>${rows(up,'Fecha')||'<tr><td colspan="6" data-label="" class="muted">Sin turnos.</td></tr>'}</tbody></table></div>`;
}

/* ---------- acciones ---------- */
function finishClose(){S.close=null;S.offer=null;S.view='s.queue';toast('Atención cerrada')}
function doSearch(){
  const q=S.rec.q.trim();if(!q)return;
  const digits=q.replace(/\D/g,'');
  const p=S.patients.find(x=>(digits.length>=6&&x.dni===digits)||(!digits&&x.nombre.toLowerCase().includes(q.toLowerCase())));
  if(!p){S.rec.res='nf';return}
  S.rec.res='found';S.rec.pac=p.id;
}
function readReg(){return {ape:val('sr-ape'),nom:val('sr-nom'),dni:val('sr-dni').replace(/\D/g,''),nac:val('sr-nac'),tel:val('sr-tel'),email:val('sr-email'),os:val('sr-os'),afil:val('sr-afil'),plan:val('sr-plan'),ok:$('sr-ok')?.checked}}
function onInvalid(f){if(f==='s-reg')S.reg.d=readReg();if(f==='login')keepLogin()}
const A={...BASE_A,
  nav(d){S.view=d.v;S.offer=null;S.err={};window.scrollTo(0,0)},
  logout(){S.sUser=null;S.login={};S.offer=null;S.view='s.login'},
  'offer-accept'(){
    const o=S.offer,p=pac(o.pac),t={id:newTurnoId(),pac:p.id,prof:o.prof,fecha:o.fecha,hora:o.hora,tipo:o.tipo,estado:'confirmado'};
    S.turnos.push(t);sendWA(p,waConfirmText(p,t));o.result=t.id;toast(`Turno ${t.id} asignado. Constancia enviada por WhatsApp.`,true);
  },
  'of-day'(d){S.offer.fecha=d.d;S.offer.hora=null},
  'of-hora'(d){S.offer.hora=d.h},
  'of-month'(d){const m=S.offer.month;S.offer.month=new Date(m.getFullYear(),m.getMonth()+ +d.dir,1)},
  'offer-stop'(){S.offer.ended=true},
  'offer-finish'(){
    const o=S.offer;S.offer=null;
    if(o.ctx==='s'){S.rec=emptyRec();S.view='s.reception';toast('Recepción lista para el próximo paciente')}
    else if(o.ctx==='sc')finishClose();
    else S.view='s.patient';
  },
  's-try'(d){S.rec={...emptyRec(),q:d.val};S.offer=null;S.view='s.reception';doSearch()},
  's-goreg'(d){const q=S.rec.q&&/^\d+$/.test(S.rec.q)?S.rec.q:'';S.reg={d:{dni:q},from:d.from||'s.patients'};S.err={};S.view='s.register';window.scrollTo(0,0)},
  's-open'(d){S.viewPac=d.id;S.offer=null;S.view='s.patient'},
  's-offer'(){startOffer(S.rec.pac,'s')},
  's-offer-for'(d){startOffer(d.id,'sp')},
  's-remind'(d){const p=pac(d.id);S.modal={type:'wa',msg:sendWA(p,`Consultorio Odontológico\nHola ${firstName(p)}, te recordamos completar tu ficha de salud antes de tu primera consulta. Ingresá al portal del paciente con tu DNI y tu contraseña. Solo la ve tu odontólogo/a.`)}},
  's-validate'(){
    const p=pac(S.rec.pac),t=nextTurnoOf(p.id);
    if(t.fecha!==TODAY) S.rec.val={ok:false,msg:`El turno ${t.id} es para el ${fmtLong(t.fecha).toLowerCase()} a las ${t.hora} h, no para hoy.`,script:`Tu turno es el ${fmtLong(t.fecha).toLowerCase()} a las ${t.hora} con ${prof(t.prof).nombre}. Hoy no podemos atenderte con ese turno; te esperamos ese día.`};
    else S.rec.val={ok:true,msg:`Turno ${t.id} de hoy a las ${t.hora} h con ${prof(t.prof).nombre}. Estado: confirmado.`};
  },
  's-inform'(){S.rec.informed=true},
  's-clear'(){S.rec=emptyRec();S.offer=null;S.focusId='rc-q'},
  's-addq'(){
    const p=pac(S.rec.pac),t=nextTurnoOf(p.id),wa=$('rc-wa')?.checked;
    const c={id:'c'+Date.now(),pac:p.id,turno:t.id,prof:t.prof,llegada:nowHM(),estado:'espera'};S.cola.push(c);
    if(wa)S.modal={type:'wa',msg:sendWA(p,`Consultorio Odontológico\nHola ${firstName(p)}, ya estás en la sala de espera.\nTurno ${t.id} con ${prof(t.prof).nombre}.\nTe avisamos por acá cuando te llamen.`)};
    toast(`${p.nombre} está en la sala de espera · posición ${queuePos(c).pos}`);S.rec=emptyRec();
  },
  's-close'(d){const s=S.salida.find(x=>x.id===d.id);S.close={id:d.id,stage:'admin',snap:s};S.err={};S.view='s.close'},
  'cl-need'(d){if(d.v==='1'){S.close.stage='offer';startOffer(S.close.snap.pac,'sc',S.close.snap.prof)}else finishClose()},
};
const F={
  login(){const u=checkLogin(STAFF);if(u){S.sUser=u;S.view='s.reception'}},
  's-search'(){S.rec={...emptyRec(),q:val('rc-q')};S.offer=null;doSearch()},
  's-reg'(){
    const r=readReg();S.reg.d=r;
    if(S.patients.some(p=>p.dni===r.dni)){S.err={'sr-dni':'Ya hay un paciente registrado con ese DNI. Buscalo en Pacientes.'};S.focusId='sr-dni';return}
    const p={id:'p'+(S.patients.length+1+Math.floor(Math.random()*1000)),hc:`HC-2026-${String(200+S.patients.length).padStart(3,'0')}`,nombre:`${r.ape}, ${r.nom}`,dni:r.dni,nac:r.nac,tel:r.tel,email:r.email,dom:'',loc:'Córdoba',os:r.os,afil:r.afil,ocup:'',
      conds:[],alergia:'',meds:'',fuma:'',emb:'',hem:'',otra:'',anam:false,pass:'Odonto'+String(1000+Math.floor(Math.random()*9000))};
    S.patients.push(p);
    sendWA(p,`Consultorio Odontológico\nHola ${firstName(p)}, ya estás registrado/a como paciente (historia clínica ${p.hc}).\nTu contraseña provisoria para el portal del paciente es: ${p.pass}\nIngresá con tu DNI y completá tu ficha de salud antes de tu primera consulta.`);
    toast(`Paciente registrado con la historia clínica ${p.hc}. Le enviamos por WhatsApp el aviso para completar su ficha de salud.`,true);
    const from=S.reg.from;S.reg=null;S.err={};
    if(from==='s.reception'){S.rec={q:p.dni,pac:p.id,res:'found',val:null};S.view='s.reception';startOffer(p.id,'s')}
    else{S.viewPac=p.id;S.view='s.patient'}
    window.scrollTo(0,0);
  },
  'cl-save'(){S.salida=S.salida.filter(x=>x.id!==S.close.id);S.close.stage='need';toast('Cierre administrativo registrado')},
};
SHORTCUTS=[
  {k:'1',label:'Ir a Recepción',run:()=>{if(S.view!=='s.login'){S.view='s.reception';S.offer=null}}},
  {k:'2',label:'Ir a Sala de espera',run:()=>{if(S.view!=='s.login'){S.view='s.queue';S.offer=null}}},
  {k:'3',label:'Ir a Pacientes',run:()=>{if(S.view!=='s.login'){S.view='s.patients';S.offer=null}}},
  {k:'4',label:'Ir a Agenda',run:()=>{if(S.view!=='s.login'){S.view='s.agenda';S.offer=null}}},
  {k:'K',label:'Buscar un paciente en recepción',run:()=>{if(S.view==='s.login')return;S.view='s.reception';S.focusId='rc-q'}},
  {k:'N',label:'Registrar un paciente nuevo',run:()=>{if(S.view!=='s.login')A['s-goreg']({from:'s.reception'})}},
  {k:'0',label:'Ver esta ayuda de atajos',run:()=>{S.modal={type:'kbd'}}},
];

bindEvents();
document.addEventListener('change',e=>{
  if(e.target.id==='of-prof'){Object.assign(S.offer,{prof:e.target.value,tipo:prof(e.target.value).tipos[0],fecha:null,hora:null});render()}
  if(e.target.id==='of-tipo'){S.offer.tipo=e.target.value}
});
document.addEventListener('input',e=>{
  const k=e.target.dataset.input;if(!k)return;S[k]=e.target.value;
  const pos=e.target.selectionStart;render();const el=$(e.target.id);if(el){try{el.setSelectionRange(pos,pos)}catch(_){}}
});
render();
</script>
</body>
</html>
