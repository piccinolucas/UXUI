<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Consultorio Odontológico G21</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: prototype bar on top; patient portal = centered column; staff = sidebar + workspace. Flow drawer on the right. */
:root{
  --accent:#0C5D56; --accent-ink:#ffffff; --accent-soft:#e3f0ee; --accent-line:#b9d6d2;
  --bg:#FFFFFF; --bg-1:#FFFFFF; --bg-2:#FFFFFF; --bg-3:#FFFFFF; --surface:#ffffff; --surface-2:#F8FAFC; --line:#E2E8F0; --fg:#0F172A; --muted:#64748B;
  --hl:#F0FDF4; --hl-line:#BBF7D0;
  --ok:#1f7a4d; --ok-soft:#e2f3ea; --warn:#8a5a00; --warn-soft:#fbf0d9; --bad:#b42318; --bad-soft:#fde8e6;
  --wa:#d9fdd3; --wa-bg:#efeae2; --wa-ink:#111b21;
  --f-display:"Bricolage Grotesque", "Onest", system-ui, sans-serif;
  --f-body:"Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:10px; --r-lg:16px; color-scheme:light;
  --shadow:0 1px 3px rgba(15,23,42,.08), 0 8px 24px rgba(15,23,42,.06); --shadow-sm:0 1px 3px rgba(15,23,42,.10); --shadow-panel:0 10px 40px rgba(15,23,42,.10);
}
*{box-sizing:border-box}
html{background:var(--bg-3)}
body{background:var(--bg);color:var(--fg);min-height:100vh}
body{font-family:var(--f-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-weight:650;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:1.75rem;line-height:1.15}
h2{font-size:1.2rem}
h3{font-size:1rem}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.86em;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* prototype bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--fg)}
.pbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--fg);color:var(--bg);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pbar .tag{font-family:var(--f-mono);font-size:.72rem;opacity:.7}
.pbar .roles{display:flex;gap:4px;background:rgba(127,127,127,.18);padding:3px;border-radius:999px;flex-wrap:wrap}
.pbar .roles button{border:0;background:transparent;color:inherit;padding:4px 12px;border-radius:999px;cursor:pointer;font-size:.85rem}
.pbar .roles button[aria-pressed="true"]{background:var(--bg);color:var(--fg)}
.pbar .sp{flex:1}
.pbar .ghost{border:1px solid rgba(127,127,127,.4);background:transparent;color:inherit;border-radius:999px;padding:4px 12px;cursor:pointer;font-size:.82rem}
.cov{display:inline-flex;align-items:center;gap:6px}
.cov i{display:block;width:60px;height:5px;border-radius:9px;background:rgba(127,127,127,.35);overflow:hidden}
.cov i b{display:block;height:100%;background:var(--accent)}

/* generic */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);
  padding:9px 16px;border-radius:var(--r);cursor:pointer;font-weight:500;transition:background .15s,border-color .15s;white-space:nowrap}
.btn:hover{border-color:var(--accent-line);background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:6px 11px;font-size:.85rem}
.btn.lg{padding:12px 20px;font-size:1rem}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow-sm)}
.card.flat{box-shadow:none}
.card.raised{box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
.stack.lg{gap:20px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:.74rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field label .req{color:var(--bad)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r);padding:10px 12px;min-width:0}
textarea.input{min-height:76px;resize:vertical}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.node{width:fit-content;align-self:flex-start;font-family:var(--f-mono);font-size:.7rem;color:var(--accent);border:1px dashed var(--accent-line);padding:2px 8px;border-radius:6px;display:inline-flex;gap:6px;align-items:center}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--bad-soft);color:var(--bad)}
.alert.info{background:var(--accent-soft);color:var(--accent)}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.ok{background:var(--ok-soft);color:var(--ok)}
.alert b{display:block}
.alert p{color:var(--fg);opacity:.85}
.hr{height:1px;background:var(--line);border:0;margin:4px 0}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:.85rem;flex:none}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 20px}
.kv div span{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .big{font-family:var(--f-display);font-size:1.3rem;color:var(--fg);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:.82rem}
.chip:hover{border-color:var(--accent)}
.chip .mono{color:var(--accent)}

/* patient shell */
.pshell{max-width:1080px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ptop{display:flex;align-items:center;gap:16px;margin-bottom:28px;flex-wrap:wrap;background:var(--surface);border-radius:var(--r-lg);padding:12px 18px;box-shadow:var(--shadow-sm)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:650;line-height:1.1}
.brand .mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:.72rem;color:var(--muted);letter-spacing:.04em}
.ptop nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.ptop nav button{border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
.ptop nav button[aria-current="true"]{color:var(--accent);background:var(--accent-soft)}

/* staff shell */
.swrap{padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sshell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 120px);max-width:1440px;margin:0 auto;background:var(--surface);border-radius:36px;border:1px solid var(--line);box-shadow:var(--shadow-panel);overflow:hidden}
.side{background:var(--surface);border-right:1px solid var(--line);padding:28px 16px;display:flex;flex-direction:column;gap:22px}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav button{display:flex;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:9px 12px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:500}
.side nav button:hover{background:var(--surface-2);color:var(--fg)}
.side nav button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.side nav .badge{margin-left:auto;font-size:.72rem;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:0 7px;font-weight:600}
.side nav button[aria-current="true"] .badge{background:rgba(255,255,255,.2);color:inherit}
.side .who{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border-top:1px solid var(--line)}
.main{padding:32px clamp(16px,4vw,48px) 48px;min-width:0}
.main-in{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.phead{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap}
.phead p{color:var(--muted);margin-top:4px}
@media (max-width:820px){
  .sshell{grid-template-columns:1fr;border-radius:20px}
  .side{flex-direction:row;align-items:center;padding:10px 16px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);gap:12px}
  .side nav{flex-direction:row}
  .side .who,.side .brand small{display:none}
}

/* stepper */
.steps{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.steps .st{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.steps .st b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;border:1px solid var(--line);background:var(--surface)}
.steps .st.on{color:var(--accent);font-weight:600}
.steps .st.on b{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.steps .st.done b{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.steps .sep{width:28px;height:1px;background:var(--line)}

/* list rows */
.list{display:flex;flex-direction:column;gap:8px}
.lrow{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);flex-wrap:wrap;box-shadow:var(--shadow-sm)}
.lrow.hl{border-color:var(--hl-line);background:var(--hl)}
.lrow .grow{flex:1;min-width:160px}
.lrow.click{cursor:pointer}
.lrow.click:hover{border-color:var(--accent-line)}
.pos{font-family:var(--f-display);font-size:1.3rem;width:34px;text-align:center;color:var(--accent)}

/* table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{width:100%;border-collapse:collapse;min-width:640px}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600;background:var(--surface-2)}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .h{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding-bottom:4px}
.cal button{aspect-ratio:1/1;max-width:100%;border-radius:10px;border:1px solid transparent;background:var(--surface-2);cursor:pointer;font-variant-numeric:tabular-nums;font-weight:500;position:relative}
.cal button.ok{background:var(--ok-soft);color:var(--ok)}
.cal button.few{background:var(--warn-soft);color:var(--warn)}
.cal button.none{background:var(--bad-soft);color:var(--bad);text-decoration:line-through;cursor:not-allowed}
.cal button.off,.cal button.past{background:transparent;color:var(--muted);opacity:.5;cursor:not-allowed}
.cal button.out{visibility:hidden}
.cal button.sel{background:var(--accent);color:var(--accent-ink)}
.cal button.today::after{content:"";position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.slots button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 0;cursor:pointer;font-variant-numeric:tabular-nums}
.slots button:hover{border-color:var(--accent)}
.slots button.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.book-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.book-grid{grid-template-columns:1fr}}

/* summary bar */
.sum{display:flex;gap:18px;flex-wrap:wrap;align-items:center;padding:14px 18px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
.sum > div{display:flex;gap:10px;align-items:center;min-width:0}
.sum small{display:block;color:var(--muted);font-size:.78rem}

/* queue hero */
.qhero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
.qnum{font-family:var(--f-display);font-size:4.5rem;line-height:1;color:var(--accent);font-weight:650}
.track{display:flex;gap:0;margin-top:14px}
.track div{flex:1;text-align:center;font-size:.78rem;color:var(--muted);position:relative;padding-top:18px}
.track div::before{content:"";position:absolute;top:5px;left:0;right:0;height:3px;background:var(--line)}
.track div::after{content:"";position:absolute;top:0;left:50%;margin-left:-6px;width:13px;height:13px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.track div.on{color:var(--accent);font-weight:600}
.track div.on::before,.track div.on::after{background:var(--accent);border-color:var(--accent)}

/* odontogram */
.odo{display:flex;flex-direction:column;gap:6px;overflow-x:auto;padding-bottom:4px}
.odo .r{display:flex;gap:4px;justify-content:center;min-width:560px}
.odo .r .mid{width:12px}
.odo button{width:30px;height:34px;border-radius:7px 7px 10px 10px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:.72rem;cursor:pointer}
.odo .r.low button{border-radius:10px 10px 7px 7px}
.odo button.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* toggles (anamnesis) */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.tg{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;background:var(--surface);text-align:left}
.tg .box{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
.tg.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:500}
.tg.on .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 16px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}

/* whatsapp */
.wa{background:var(--wa-bg);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.wa .head{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.wa .bub{background:var(--wa);color:var(--wa-ink);border-radius:10px 10px 2px 10px;padding:10px 12px;max-width:420px;align-self:flex-end;font-size:.88rem;white-space:pre-line;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.wa .bub small{display:block;text-align:right;opacity:.6;font-size:.7rem;margin-top:4px}

/* decision track for reception */
.dtrack{display:flex;flex-direction:column;gap:0}
.dstep{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding-bottom:16px;position:relative}
.dstep::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.dstep:last-child::before{display:none}
.dstep .q{width:28px;height:28px;border-radius:8px;transform:rotate(45deg) scale(.78);display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line)}
.dstep .q span{transform:rotate(-45deg);font-size:.7rem;font-weight:700}
.dstep.yes .q{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.dstep.no .q{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.dstep.cur .q{background:var(--accent);color:var(--accent-ink);border-color:transparent}

/* drawer & toast & modal */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:40;
  padding:calc(20px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-right,0px)) 20px 20px;overflow-y:auto;box-shadow:-10px 0 40px rgba(0,0,0,.12)}
.drawer h3{margin:18px 0 8px}
.drawer ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.drawer li{display:flex;gap:8px;align-items:center;font-size:.86rem;color:var(--muted)}
.drawer li.v{color:var(--fg)}
.drawer li i{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;font-style:normal;font-size:.7rem}
.drawer li.v i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.drawer li.dec i{border-radius:3px;transform:rotate(45deg) scale(.8)}
.drawer li.dec.v i{transform:rotate(45deg) scale(.8)}
.scrim{position:fixed;inset:0;background:rgba(10,20,18,.35);z-index:35}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:50;font-size:.9rem;box-shadow:var(--shadow);max-width:calc(100% - 32px);animation:up .25s ease}
@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}
.modal{position:fixed;inset:0;z-index:45;display:grid;place-items:center;padding:16px}
.modal{pointer-events:none}
.modal .card{pointer-events:auto;max-width:520px;width:100%;max-height:90vh;overflow:auto}

/* home */
.home{max-width:1080px;margin:0 auto;padding-block:48px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:32px}
.home h1{font-size:clamp(2rem,5vw,3.1rem);max-width:18ch}
.roles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:820px){.roles3{grid-template-columns:1fr}}
.rolecard{text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:12px;transition:border-color .15s, transform .15s}

function slotsFor(pid,date){
  const p=prof(pid),d=parse(date);
  if(!p.dias.includes(d.getDay())) return [];
  if(date<TODAY) return [];
  return TIMES.filter(t=>hh(pid+date+t)%3!==0
    && !S.turnos.some(x=>x.prof===pid&&x.fecha===date&&x.hora===t&&x.estado!=='cancelado')
    && !(date===TODAY && t<=nowHM()));
}
function dayState(pid,date){
  const p=prof(pid),d=parse(date);
  if(date<TODAY) return 'past';
  if(!p.dias.includes(d.getDay())) return 'off';
  const n=slotsFor(pid,date).length;
  return n===0?'none':n<=4?'few':'ok';
}
function offerSlots(pid,page){
  const out=[];let d=addDays(parse(TODAY),1);
  for(let i=0;i<90&&out.length<(page+1)*3;i++,d=addDays(d,1)){
    const s=iso(d),sl=slotsFor(pid,s);
    if(sl.length) out.push({fecha:s,hora:sl[hh(s)%sl.length]});
  }
  return out.slice(page*3,page*3+3);
}
function queueFor(pid){return S.cola.filter(c=>c.prof===pid&&c.estado!=='finalizado')}
function queuePos(c){
  const q=S.cola.filter(x=>x.prof===c.prof&&x.estado==='espera');
  const pos=q.findIndex(x=>x.id===c.id)+1;
  const busy=S.cola.some(x=>x.prof===c.prof&&x.estado==='atendiendo');
  return {pos,wait:(pos-1)*30+(busy?20:0)};
}

}

      <p class="small muted">Constancia enviada a <span class="mono">${esc(p.tel)}</span></p>
      ${o.ctx!=='o'?`<div><button class="btn pri" data-a="offer-finish">Finalizar</button></div>`:''}</div>${m?waBox(m):''}</div>`;}
  if(o.ended) return `${node(pre+'.mas')}<div class="alert warn">${I.warn}<div><b>Sin turno asignado</b><p>${esc(p.nombre)} no aceptó las opciones. Puede pedir uno más adelante desde el portal del paciente.</p></div></div>${o.ctx!=='o'?`<div><button class="btn pri" data-a="offer-finish">Finalizar</button></div>`:''}`;

      <div class="field" style="min-width:220px"><label for="of-prof">Profesional</label><select class="input" id="of-prof" data-change="offer-prof">${PROFS.map(x=>`<option value="${x.id}" ${o.prof===x.id?'selected':''}>${x.nombre} · ${x.esp}</option>`).join('')}</select></div></div>

    <div class="offer">${sl.map((s,i)=>`<div class="o"><span class="eyebrow">Opción ${o.page*3+i+1}</span><span class="d">${fmtLong(s.fecha)}</span><span class="mono">${s.hora} h</span><button class="btn pri sm" data-a="offer-accept" data-f="${s.fecha}" data-h="${s.hora}">Acepta este turno</button></div>`).join('')||'<p class="muted">Sin disponibilidad en los próximos 90 días.</p>'}</div>
    <div><button class="btn" data-a="offer-reject">No acepta ninguno</button></div></div>`;
}
function startOffer(pid,ctx,profId){S.offer={pac:pid,ctx,prof:profId||'L',tipo:prof(profId||'L').tipos[0],page:0};visit(ctx==='o'?'o.ofrecer':'s.ofrecer')}

/* ---- secretaría ---- */
function sReception(){
  const r=S.rec;let res='';
  if(r.res){
    const p=r.pac&&pac(r.pac);
    const step=(cls,label,content)=>`<div class="dstep ${cls}"><span class="q"><span>${cls==='yes'?'SÍ':cls==='no'?'NO':'?'}</span></span><div class="stack" style="gap:6px;padding-top:3px"><b>${label}</b>${content||''}</div></div>`;
    let steps='';
    if(r.res==='nf'){
      steps=step('no','¿Registrado?',`<p class="muted">No hay ningún paciente con DNI <span class="mono">${esc(r.q)}</span>.</p><div><button class="btn pri" data-a="s-goreg">Registrar datos del paciente ${I.arrow}</button></div>`);
    } else {
      const t=nextTurnoOf(p.id);const c=colaOf(p.id);
      steps=step('yes','¿Registrado?',`<div class="lrow"><span class="avatar">${initials(p.nombre.split(',').reverse().join(' '))}</span><div class="grow"><b>${esc(p.nombre)}</b><br><span class="muted small"><span class="mono">${p.hc}</span> · DNI <span class="mono">${p.dni}</span> · ${esc(p.os)}</span></div><button class="btn sm" data-a="s-open" data-id="${p.id}">Ver ficha</button></div>`);
      if(c&&c.estado!=='finalizado'){
        steps+=step('yes','¿Tiene turno?',`<div class="alert info">${I.queue}<div><b>Ya está en la cola</b><p>${c.estado==='atendiendo'?'Está siendo atendido.':`Posición ${queuePos(c).pos} con ${prof(c.prof).nombre}.`}</p></div></div>`);
      } else if(!t){
        steps+=step('no','¿Tiene turno?',`<p class="muted">No tiene turnos pendientes.</p>${S.offer&&S.offer.ctx==='s'?'':`<div><button class="btn pri" data-a="s-offer">Ofrecer turnos disponibles ${I.arrow}</button></div>`}`);
      } else {
        steps+=step('yes','¿Tiene turno?',`<p><b>${fmtLong(t.fecha)} · ${t.hora} h</b> <span class="muted">· ${prof(t.prof).nombre} · ${esc(t.tipo)} · <span class="mono">${t.id}</span></span></p>`);
        if(!r.val){steps+=step('cur','Validar turno',`<p class="muted small">Se controla fecha, estado y profesional del turno.</p><div><button class="btn pri" data-a="s-validate">Validar turno</button></div>`);}
        else if(r.val.ok){
          steps+=step('yes','¿Es válido?',`<div class="alert ok">${I.check}<div><b>Turno válido</b><p>${esc(r.val.msg)}</p></div></div>`);
          steps+=step('cur','Agregar paciente a cola',`<div class="row"><button class="btn pri" data-a="s-addq">Agregar a la cola de ${esc(prof(t.prof).nombre)}</button><label class="row small" style="gap:6px"><input type="checkbox" id="rc-wa" checked> Avisar por WhatsApp</label></div>`);
        } else {
          steps+=step('no','¿Es válido?',`<div class="alert">${I.warn}<div><b>Turno no válido</b><p>${esc(r.val.msg)}</p></div></div>`);
          steps+=step(r.informed?'yes':'cur','Informar situación',r.informed?`<p class="muted">Situación informada al paciente. Fin del circuito.</p><div><button class="btn" data-a="s-clear">Atender a otra persona</button></div>`
            :`<div class="card flat" style="padding:12px;background:var(--surface-2)"><span class="eyebrow">Qué decirle</span><p>"${esc(r.val.script)}"</p></div><div><button class="btn pri" data-a="s-inform">Situación informada</button></div>`);
        }
      }
    }
    res=`<div class="card raised"><div class="dtrack">${steps}</div></div>
      ${S.offer&&S.offer.ctx==='s'?`<div class="card raised">${offerPanel()}</div>`:''}`;
  }
  return `<div class="phead"><div>${node('s.llegada')}<h1 style="margin-top:6px">Recepción</h1><p>Buscá a la persona que llegó para validar su turno o darle uno.</p></div>
    <div class="row"><button class="btn pri" data-a="s-goreg">${I.plus} Registrar nuevo paciente</button></div></div>
  <form class="card stack" data-form="s-search">
    <div class="field"><label for="rc-q">Nombre o DNI del paciente</label>
      <div class="row" style="flex-wrap:nowrap"><input class="input" id="rc-q" value="${esc(r.q)}" placeholder="Ej.: Juan Carlos o 38647762" autocomplete="off"><button class="btn pri" type="submit">${I.search} Buscar</button></div></div>
    <div class="chips">${['44122123','35012987','30111222','27999555'].map(d=>`<button type="button" class="chip" data-a="s-try" data-val="${d}"><span class="mono">${d}</span></button>`).join('')}</div>
  </form>
  ${res}
  ${!r.res?`<div class="card stack"><div class="row between"><h3>Esperados hoy</h3><span class="muted small">Turnos confirmados que todavía no llegaron</span></div>
    ${(()=>{const l=S.turnos.filter(t=>t.fecha===TODAY&&t.estado==='confirmado'&&!colaOf(t.pac)).sort((a,b)=>a.hora.localeCompare(b.hora));
      return l.length?`<div class="list">${l.map(t=>`<div class="lrow click" data-a="s-try" data-val="${pac(t.pac).dni}"><span class="mono">${t.hora}</span><div class="grow"><b>${esc(pac(t.pac).nombre)}</b><br><span class="muted small">${prof(t.prof).nombre} · ${esc(t.tipo)}</span></div><span class="link">Recibir ${I.arrow}</span></div>`).join('')}</div>`:'<p class="muted">Todos los pacientes del día ya llegaron.</p>'})()}</div>`:''}`;
}

function sQueue(){

  const esperando=PROFS.flatMap(pr=>S.cola.filter(c=>c.prof===pr.id&&c.estado==='espera'));
  return `<div class="phead"><div><h1>Cola de espera</h1><p>${cap(fmtLong(TODAY))} · se actualiza con lo que hacen los profesionales</p></div><button class="btn pri" data-a="nav" data-v="s.reception">${I.plus} Recibir paciente</button></div>
  <div class="cols3">
    ${col('En espera',esperando,'Nadie esperando.',c=>{const p=pac(c.pac),{pos,wait}=queuePos(c);return `<div class="lrow"><span class="pos">${pos}</span><div class="grow"><b>${esc(p.nombre)}</b><br><span class="muted small">${prof(c.prof).nombre}<br>Llegó ${c.llegada} · ~${wait} min</span></div></div>`})}
    ${col('En atención',all.filter(c=>c.estado==='atendiendo'),'Ningún consultorio ocupado.',c=>{const p=pac(c.pac);return `<div class="lrow hl"><div class="grow">${node('s.brindar')}<br><b>${esc(p.nombre)}</b><br><span class="muted small">${prof(c.prof).nombre} · ${prof(c.prof).box}</span></div></div>`})}
    ${col('Atendidos · pendiente de cierre',S.salida,'Cuando un profesional finaliza una atención, aparece acá para el cierre.',s=>{const p=pac(s.pac);return `<div class="lrow"><div class="grow"><b>${esc(p.nombre)}</b><br><span class="muted small">${prof(s.prof).nombre} · salió ${s.salida} h${s.turnoNuevo?' · ya tiene turno nuevo':''}</span></div><button class="btn pri sm" data-a="s-close" data-id="${s.id}">Cerrar</button></div>`})}
  </div>`;
}
function sClose(){
  const k=S.close;const s=S.salida.find(x=>x.id===k.id)||k.snap;const p=pac(s.pac);const last=S.hc.find(h=>h.pac===p.id);
  let body='';
  if(k.stage==='hist'){
    body=`<div class="card raised stack">${node('s.historial')}<h2>Registrar en el historial clínico</h2>
      ${last?`<div class="lrow"><div class="grow"><b>${esc(last.motivo)}</b> · ${esc(last.proc)}<br><span class="muted small">${esc(prof(last.prof).nombre)} · piezas <span class="mono">${esc(last.piezas)}</span> · ${fmtShort(last.fecha)}</span></div><span class="pill acc">Cargado por el profesional</span></div>`:''}
      <div class="grid2"><div class="field"><label for="cl-os">Cobertura de la práctica</label><select class="input" id="cl-os"><option>${esc(p.os)}</option><option>Particular / Sin obra social</option></select></div>
      <div class="field"><label for="cl-cod">Código de prestación</label><input class="input mono" id="cl-cod" value="01.01"></div></div>
      <div class="field"><label for="cl-obs">Observaciones administrativas</label><textarea class="input" id="cl-obs" placeholder="Ej.: abonó coseguro, falta orden firmada"></textarea></div>
      <div class="row" style="justify-content:flex-end"><button class="btn pri" data-a="cl-save">Registrar y continuar ${I.arrow}</button></div></div>`;
  } else if(k.stage==='need'){
    body=`<div class="card raised stack">${node('s.otro')}<h2>¿Necesita otro turno?</h2>${s.turnoNuevo?`<div class="alert info">${I.cal}<div><b>El profesional ya le dio un turno</b><p>${esc(s.turnoNuevo)}</p></div></div>`:''}
      <div class="row"><button class="btn pri" data-a="cl-need" data-v="1">Sí, ofrecer turnos</button><button class="btn" data-a="cl-need" data-v="0">No, finalizar</button></div></div>`;
  } else if(k.stage==='offer'){
    body=`<div class="card raised">${offerPanel()}</div>`;
  }
  return `<div class="phead"><div><div class="row" style="gap:6px">${node('s.quitar')}</div><h1 style="margin-top:6px">Cierre de atención</h1><p>${esc(p.nombre)} · ${prof(s.prof).nombre}</p></div>
    <div class="steps"><span class="st done"><b>✓</b>Quitar de la cola</span><span class="sep"></span><span class="st ${k.stage==='hist'?'on':'done'}"><b>${k.stage==='hist'?2:'✓'}</b>Historial</span><span class="sep"></span><span class="st ${k.stage!=='hist'?'on':''}"><b>3</b>Otro turno</span></div></div>
  ${body}`;
}

function agenda(){
  const isO=S.role==='odontologo';
  const l=S.turnos.filter(t=>t.fecha===TODAY&&t.estado!=='cancelado'&&(!isO||t.prof===S.oUser)).sort((a,b)=>a.hora.localeCompare(b.hora));
  const st=t=>{const c=S.cola.find(x=>x.turno===t.id);if(t.estado==='atendido')return '<span class="pill ok">Atendido</span>';if(c?.estado==='atendiendo')return '<span class="pill acc">En atención</span>';if(c?.estado==='espera')return '<span class="pill warn">En espera</span>';return '<span class="pill">Pendiente</span>'};
  const up=S.turnos.filter(t=>t.fecha>TODAY&&t.estado==='confirmado'&&(!isO||t.prof===S.oUser)).sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora)).slice(0,8);
  const rows=arr=>arr.map(t=>`<tr><td class="num mono">${t.fecha===TODAY?t.hora:fmtShort(t.fecha)+' '+t.hora}</td><td><b>${esc(pac(t.pac).nombre)}</b><br><span class="muted small">DNI <span class="mono">${pac(t.pac).dni}</span></span></td><td>${prof(t.prof).nombre}</td><td>${esc(t.tipo)}</td><td class="mono">${t.id}</td><td>${t.fecha===TODAY?st(t):'<span class="pill ok">Confirmado</span>'}</td></tr>`).join('');
  return `<div class="phead"><div><h1>${isO?'Agenda de hoy':'Turnos'}</h1><p>${cap(fmtLong(TODAY))}</p></div>${isO?'':`<button class="btn pri" data-a="nav" data-v="s.reception">${I.plus} Dar turno</button>`}</div>
  <div class="tbl-wrap"><table><thead><tr><th>Hora</th><th>Paciente</th><th>Profesional</th><th>Atención</th><th>Código</th><th>Estado</th></tr></thead><tbody>${rows(l)||'<tr><td colspan="6" class="muted">Sin turnos hoy.</td></tr>'}</tbody></table></div>
  <h2>Próximos días</h2>
  <div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th>Paciente</th><th>Profesional</th><th>Atención</th><th>Código</th><th>Estado</th></tr></thead><tbody>${rows(up)||'<tr><td colspan="6" class="muted">Sin turnos.</td></tr>'}</tbody></table></div>`;
}

const A={
  'go-home'(){S.role=null;S.view='home'},
  role(d){
    S.role=d.r;S.offer=null;
    if(d.r==='paciente'){S.view=S.pUser?'p.home':'p.login';visit('p.acceso')}
    if(d.r==='odontologo'){S.view=S._oIn?'o.queue':'o.login'}
    if(d.r==='secretario'){S.view=S._sIn?'s.reception':'s.login'}
  },
  flow(){S.flowOpen=!S.flowOpen},
  reset(){reset();toast('Demo reiniciada con los datos de ejemplo')},
  nav(d){S.view=d.v;if(d.v!=='s.reception'&&S.offer&&S.offer.ctx!=='o')S.offer=null;window.scrollTo(0,0)},
  'close-modal'(){S.modal=null},
  fill(d){const el=$(d.t);if(el){el.value=d.val;S.plogin.dni=d.val}return false},
  /* paciente */
  'p-goreg'(){S.preg={dni:S.plogin.dni};S.view='p.register'},
  'p-logout'(){S.pUser=null;S.plogin={dni:'',state:null};S.view='p.login'},
  'p-newbook'(){S.book={step:1,prof:null,tipo:'',month:new Date(parse(TODAY).getFullYear(),parse(TODAY).getMonth(),1),fecha:null,hora:null};S.view='p.book';visit('p.turnos')},
  'bk-prof'(d){S.book.prof=d.id;S.book.fecha=null;S.book.hora=null},
  'bk-step'(d){S.book.step=+d.s;window.scrollTo(0,0)},
  'bk-month'(d){const m=S.book.month;S.book.month=new Date(m.getFullYear(),m.getMonth()+ +d.dir,1)},
  'bk-day'(d){S.book.fecha=d.d;S.book.hora=null},
  'bk-hora'(d){S.book.hora=d.h},
  'bk-confirm'(){
    const b=S.book,p=pac(S.pUser);const tel=val('bk-tel');if(tel)p.tel=tel;
    const t={id:newTurnoId(),pac:p.id,prof:b.prof,fecha:b.fecha,hora:b.hora,tipo:b.tipo||'Consulta y revisión',estado:'confirmado'};
    S.turnos.push(t);sendWA(p,t);b.done=t.id;S.view='p.done';visit('p.solicitar','p.constancia');window.scrollTo(0,0);
  },
  /* odontólogo */
  'o-enter'(d){S.oUser=d.id;S._oIn=true;S.view='o.queue';visit('o.acceso','o.hay')},
  logout(){if(S.role==='odontologo'){S._oIn=false;S.view='o.login'}else{S._sIn=false;S.view='s.login'}},
  'o-call'(d){const c=S.cola.find(x=>x.id===d.id);c.estado='atendiendo';c.llamado=nowHM();S.att={cola:c.id,teeth:[]};S.offer=null;S.view='o.patient';visit('o.marcar','o.llamar','o.info');toast(`Llamando a ${pac(c.pac).nombre} a ${prof(c.prof).box}`);window.scrollTo(0,0)},
  'o-open'(d){if(!S.att||S.att.cola!==d.id)S.att={cola:d.id,teeth:[]};S.view=S.att.saved?'o.next':'o.patient';visit('o.info')},
  'o-recall'(){toast('Se volvió a anunciar al paciente en la sala')},
  'o-start'(){S.view='o.attend';visit('o.atender');window.scrollTo(0,0)},
  'o-hcp'(d){S.viewPac=d.id;S.view='o.hcp'},
  tooth(d){const n=+d.n,a=S.att.teeth;const i=a.indexOf(n);i<0?a.push(n):a.splice(i,1);a.sort((x,y)=>x-y);saveAtt()},
  'o-need'(d){const c=S.cola.find(x=>x.id===S.att.cola);visit('o.necesita');S.att.need=d.v==='1';if(S.att.need)startOffer(c.pac,'o',c.prof)},
  'o-quit'(){
    const c=S.cola.find(x=>x.id===S.att.cola);c.estado='finalizado';const t=turno(c.turno);if(t)t.estado='atendido';
    const nt=S.offer&&S.offer.result?turno(S.offer.result):null;
    S.salida.push({id:'s'+Date.now(),pac:c.pac,prof:c.prof,salida:nowHM(),turnoNuevo:nt?`${fmtLong(nt.fecha)} · ${nt.hora} h (${nt.id})`:null});
    S.cola=S.cola.filter(x=>x.id!==c.id);visit('o.quitar','s.brindar');
    S.att=null;S.offer=null;S.view='o.queue';toast('Paciente quitado de la cola. Recepción hace el cierre.');
  },
  'o-hcp-btn'(){},
  /* offer */
  'offer-accept'(d){
    const o=S.offer,p=pac(o.pac);const t={id:newTurnoId(),pac:p.id,prof:o.prof,fecha:d.f,hora:d.h,tipo:o.tipo,estado:'confirmado'};
    S.turnos.push(t);sendWA(p,t);o.result=t.id;const pre=o.ctx==='o'?'o':'s';visit(pre+'.acepta');if(pre==='s')visit('s.constancia');

  },
  'offer-reject'(){S.offer.asking=true;visit((S.offer.ctx==='o'?'o':'s')+'.acepta')},

  'offer-stop'(){S.offer.asking=false;S.offer.ended=true;visit((S.offer.ctx==='o'?'o':'s')+'.mas')},
  'offer-finish'(){
    const o=S.offer;S.offer=null;
    if(o.ctx==='s'){S.rec={q:'',pac:null,res:null,val:null};S.view='s.reception';toast('Recepción lista para el próximo paciente')}
    else if(o.ctx==='sc'){finishClose()}
    else if(o.ctx==='sp'){S.view='s.patient'}
  },
  /* secretaría */
  's-try'(d){S.rec={q:d.val,res:null,pac:null,val:null};S.offer=null;S.view='s.reception';doSearch()},
  's-goreg'(d){const q=S.rec.q&&/^\d+$/.test(S.rec.q)?S.rec.q:'';S.reg={step:1,d:{dni:q},a:{conds:[],alergia:'',meds:'',emb:'',hem:'',fuma:'',otra:''},from:d.from||'s.reception'};S.view='s.register';window.scrollTo(0,0)},
  's-open'(d){S.viewPac=d.id;S.offer=null;S.view='s.patient'},
  's-hcp'(d){S.viewPac=d.id;S.view='s.hcp'},
  's-offer'(){startOffer(S.rec.pac,'s','L')},
  's-offer-for'(d){startOffer(d.id,'sp','L')},
  's-validate'(){
    const p=pac(S.rec.pac),t=nextTurnoOf(p.id);visit('s.validar','s.valido');
    if(t.fecha!==TODAY) S.rec.val={ok:false,msg:`El turno ${t.id} es para el ${fmtLong(t.fecha).toLowerCase()} a las ${t.hora} h, no para hoy.`,script:`Tu turno es el ${fmtLong(t.fecha).toLowerCase()} a las ${t.hora} con ${prof(t.prof).nombre}. Hoy no podemos atenderte con ese turno; te esperamos ese día.`};
    else S.rec.val={ok:true,msg:`Turno ${t.id} de hoy a las ${t.hora} h con ${prof(t.prof).nombre}. Estado confirmado.`};
  },
  's-inform'(){S.rec.informed=true;visit('s.informar')},
  's-clear'(){S.rec={q:'',pac:null,res:null,val:null};S.offer=null},
  's-addq'(){
    const p=pac(S.rec.pac),t=nextTurnoOf(p.id);const wa=$('rc-wa')?.checked;
    const c={id:'c'+Date.now(),pac:p.id,turno:t.id,prof:t.prof,llegada:nowHM(),estado:'espera'};S.cola.push(c);visit('s.agregar');
    if(wa){const m=sendWA(p,t,'cola');S.modal={type:'wa',msg:m}}
    toast(`${p.nombre} está en la cola · posición ${queuePos(c).pos}`);S.rec={q:'',pac:null,res:null,val:null};
  },
  'an-cond'(d){const a=S.reg.a;readAnam();const i=a.conds.indexOf(d.c);i<0?a.conds.push(d.c):a.conds.splice(i,1)},
  'an-seg'(d){readAnam();S.reg.a[d.k]=d.v},
  'reg-back'(){readAnam();S.reg.step=1},
  'reg-save'(){
    readAnam();const g=S.reg,a=g.a;
    const p=createPatient(g.d,{conds:[...a.conds,...(a.hem==='Sí'&&!a.conds.includes('Problemas de coagulación')?['Propenso a hemorragias']:[])],alergia:a.alergia||'No',meds:a.meds||'No',fuma:a.fuma||'No informado'});
    visit('s.registrado','s.registra');toast(`Ficha creada: ${p.hc}`);
    if(g.from==='s.patients'){S.viewPac=p.id;S.view='s.patient'}
    else{S.rec={q:p.dni,pac:p.id,res:'found',val:null};S.view='s.reception';visit('s.tiene');startOffer(p.id,'s','L')}
    S.reg=null;window.scrollTo(0,0);
  },
  's-close'(d){const s=S.salida.find(x=>x.id===d.id);S.close={id:d.id,stage:'hist',snap:s};S.view='s.close';visit('s.quitar')},
  'cl-save'(){const k=S.close;const s=k.snap;S.salida=S.salida.filter(x=>x.id!==k.id);k.stage='need';visit('s.historial');toast('Registrado en el historial clínico')},
  'cl-need'(d){visit('s.otro');if(d.v==='1'){S.close.stage='offer';startOffer(S.close.snap.pac,'sc',S.close.snap.prof)}else finishClose()},
  'hc-det'(d){const hist=S.hc.filter(h=>h.pac===d.pac).sort((a,b)=>b.fecha.localeCompare(a.fecha));S.modal={type:'hcdet',h:hist[+d.i]}},
};
function finishClose(){S.close=null;S.offer=null;S.view='s.queue';toast('Atención cerrada')}
function readAnam(){const a=S.reg?.a;if(!a||!$('an-alergia'))return;a.alergia=val('an-alergia');a.meds=val('an-meds');a.otra=val('an-otra')}
function saveAtt(){if(!$('at-proc'))return;Object.assign(S.att,{motivo:val('at-motivo'),proc:val('at-proc'),diag:val('at-diag'),ind:val('at-ind'),notas:val('at-notas')})}
function doSearch(){
  const q=S.rec.q.trim();if(!q){return}
  visit('s.llegada','s.registrado');
  const digits=q.replace(/\D/g,'');
  const p=S.patients.find(x=>(digits.length>=6&&x.dni===digits)||(!digits&&x.nombre.toLowerCase().includes(q.toLowerCase())));
  if(!p){S.rec.res='nf';return}
  S.rec.res='found';S.rec.pac=p.id;visit('s.tiene');
}

/* forms */
const F={
  'p-login'(){
    const d=val('pl-dni').replace(/\D/g,'');S.plogin.dni=d;visit('p.validar','p.existe');
    if(!/^\d{7,8}$/.test(d)){S.plogin.state='bad';return}
    const p=S.patients.find(x=>x.dni===d);
    if(!p){S.plogin.state='nf';return}
    S.pUser=p.id;S.plogin.state=null;S.view='p.home';visit('p.tiene');if(colaOf(p.id))visit('p.cola');
  },
  'p-reg'(){
    const r=readReg('pr');const e=regErrors(r);if(e.length){S.preg={...r,err:e};return}
    const p=createPatient(r);S.pUser=p.id;S.preg=null;visit('p.registrar');toast(`Te registramos con la historia clínica ${p.hc}`);A['p-newbook']();
  },
  's-login'(){S._sIn=true;S.view='s.reception';visit('s.acceso')},
  's-search'(){S.rec={q:val('rc-q'),res:null,pac:null,val:null};S.offer=null;doSearch()},
  's-reg1'(){const r=readReg('sr');const e=regErrors(r);if(e.length){S.reg.d=r;S.reg.err=e;return}S.reg.d=r;S.reg.err=null;S.reg.step=2;window.scrollTo(0,0)},
  'o-hc'(){
    saveAtt();const a=S.att;if(!a.proc){a.err=true;return}a.err=false;
    const c=S.cola.find(x=>x.id===a.cola);
    S.hc.push({pac:c.pac,fecha:TODAY,prof:c.prof,motivo:a.motivo,piezas:a.teeth.length?a.teeth.join(', '):'—',proc:a.proc,diag:a.diag||'—',notas:[a.notas,a.ind&&('Indicaciones: '+a.ind)].filter(Boolean).join(' ')||'—'});
    a.saved=true;S.view='o.next';visit('o.hc');toast('Historia clínica actualizada');window.scrollTo(0,0);
  },
};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const fn=A[el.dataset.a];if(!fn)return;e.preventDefault();
  if(S.view==='o.attend'&&el.dataset.a!=='tooth')saveAtt();
  const r=fn(el.dataset,el);if(r!==false)render();
});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();F[f.dataset.form]?.();render()});
document.addEventListener('change',e=>{
  const k=e.target.dataset.change;if(!k)return;
  if(k==='bk-tipo'){S.book.tipo=e.target.value;if(S.book.prof&&S.book.tipo&&!prof(S.book.prof).tipos.includes(S.book.tipo))S.book.prof=null}
  if(k==='offer-prof'){S.offer.prof=e.target.value;S.offer.page=0;S.offer.tipo=prof(e.target.value).tipos[0]}
  if(k==='offer-tipo'){S.offer.tipo=e.target.value}
  render();
});
document.addEventListener('input',e=>{
  const k=e.target.dataset.input;if(!k)return;S[k]=e.target.value;
  const pos=e.target.selectionStart;const id=e.target.id;render();const el=$(id);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(_){}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.modal||S.flowOpen)){S.modal=null;S.flowOpen=false;render()}});
render();
</script>

</body></html>
