<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Consultorio Odontológico — Panel Profesional</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
:root{
  --accent:#09534D; --accent-ink:#ffffff; --accent-soft:#EBF5F4; --accent-line:#6A9E96;
  --bg:#FFFFFF; --bg-1:#FFFFFF; --bg-2:#FFFFFF; --bg-3:#F8FAFC; --surface:#ffffff; --surface-2:#F8FAFC; --line:#94A3B8; --fg:#0F172A; --muted:#334155;
  --hl:#F0FDF4; --hl-line:#86EFAC;
  --ok:#0F5632; --ok-soft:#EAF7F0; --warn:#663D00; --warn-soft:#FDF6E9; --bad:#96150E; --bad-soft:#FEEFEF;
  --wa:#D9FDD3; --wa-bg:#EFEAE2; --wa-ink:#0F172A;
  --f-display:"Bricolage Grotesque", "Onest", system-ui, sans-serif;
  --f-body:"Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:10px; --r-lg:16px; color-scheme:light;
  --shadow:0 1px 3px rgba(15,23,42,.08), 0 8px 24px rgba(15,23,42,.06); --shadow-sm:0 1px 3px rgba(15,23,42,.10); --shadow-panel:0 10px 40px rgba(15,23,42,.10);
}
*{box-sizing:border-box}
html{background:var(--bg-3)}
body{margin:0;padding:0;background:var(--bg-3);color:var(--fg);min-height:100vh;font-family:var(--f-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-weight:650;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:1.75rem;line-height:1.15}
h2{font-size:1.2rem}
h3{font-size:1rem}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.86em;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
::placeholder{color:var(--muted);opacity:1}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* generic */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);
  padding:9px 16px;border-radius:var(--r);cursor:pointer;font-weight:500;transition:background .15s,border-color .15s;white-space:nowrap}
.btn:hover{border-color:var(--accent-line);background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:6px 11px;font-size:.85rem}
.btn.lg{padding:12px 20px;font-size:1rem}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow-sm)}
.card.flat{box-shadow:none}
.card.raised{box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
.stack.lg{gap:20px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:.74rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700}
.field label .req{color:var(--bad)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r);padding:10px 12px;min-width:0}
textarea.input{min-height:76px;resize:vertical}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--bad-soft);color:var(--bad)}
.alert.info{background:var(--accent-soft);color:var(--accent)}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.ok{background:var(--ok-soft);color:var(--ok)}
.alert b{display:block}
.alert p{color:var(--fg);opacity:1;font-weight:500}
.hr{height:1px;background:var(--line);border:0;margin:4px 0}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:.85rem;flex:none}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 20px}
.kv div span{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .big{font-family:var(--f-display);font-size:1.3rem;color:var(--fg);margin-bottom:6px}

/* staff shell */
.swrap{padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sshell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 48px);max-width:1440px;margin:0 auto;background:var(--surface);border-radius:24px;border:1px solid var(--line);box-shadow:var(--shadow-panel);overflow:hidden}
.side{background:var(--surface);border-right:1px solid var(--line);padding:28px 16px;display:flex;flex-direction:column;gap:22px}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav button{display:flex;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:9px 12px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:600}
.side nav button:hover{background:var(--surface-2);color:var(--fg)}
.side nav button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.side nav .badge{margin-left:auto;font-size:.72rem;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:0 7px;font-weight:600}
.side nav button[aria-current="true"] .badge{background:rgba(255,255,255,.2);color:inherit}
.side .who{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border-top:1px solid var(--line)}
.main{padding:32px clamp(16px,4vw,48px) 48px;min-width:0}
.main-in{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.phead{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap}
.phead p{color:var(--muted);margin-top:4px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:650;line-height:1.1}
.brand .mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:.72rem;color:var(--muted);letter-spacing:.04em}

@media (max-width:820px){
  .sshell{grid-template-columns:1fr;border-radius:16px}
  .side{flex-direction:row;align-items:center;padding:10px 16px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);gap:12px}
  .side nav{flex-direction:row}
  .side .who,.side .brand small{display:none}
}

/* list rows */
.list{display:flex;flex-direction:column;gap:8px}
.lrow{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);flex-wrap:wrap;box-shadow:var(--shadow-sm)}
.lrow.hl{border-color:var(--hl-line);background:var(--hl)}
.lrow .grow{flex:1;min-width:160px}
.lrow.click{cursor:pointer}
.lrow.click:hover{border-color:var(--accent-line)}
.pos{font-family:var(--f-display);font-size:1.3rem;width:34px;text-align:center;color:var(--accent)}

/* table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{width:100%;border-collapse:collapse;min-width:640px}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700;background:var(--surface-2)}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums}

/* odontogram */
.odo{display:flex;flex-direction:column;gap:6px;overflow-x:auto;padding-bottom:4px}
.odo .r{display:flex;gap:4px;justify-content:center;min-width:560px}
.odo .r .mid{width:12px}
.odo button{width:30px;height:34px;border-radius:7px 7px 10px 10px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:.72rem;cursor:pointer}
.odo .r.low button{border-radius:10px 10px 7px 7px}
.odo button.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* offer */
.offer{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:760px){.offer{grid-template-columns:1fr}}
.offer .o{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.offer .o .d{font-family:var(--f-display);font-size:1.05rem}
.callbanner{background:var(--accent);color:var(--accent-ink);border-radius:var(--r-lg);padding:16px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.callbanner .grow{flex:1;min-width:200px}
.callbanner .btn{background:transparent;color:#FFFFFF;border-color:rgba(255,255,255,.8);font-weight:600}

/* whatsapp */
.wa{background:var(--wa-bg);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.wa .head{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.wa .bub{background:var(--wa);color:var(--wa-ink);border-radius:10px 10px 2px 10px;padding:10px 12px;max-width:420px;align-self:flex-end;font-size:.88rem;white-space:pre-line;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.wa .bub small{display:block;text-align:right;color:#1B4332;opacity:1;font-weight:600;font-size:.75rem;margin-top:4px}

.scrim{position:fixed;inset:0;background:rgba(10,20,18,.35);z-index:35}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:50;font-size:.9rem;box-shadow:var(--shadow);max-width:calc(100% - 32px);animation:up .25s ease}
@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}
.modal{position:fixed;inset:0;z-index:45;display:grid;place-items:center;padding:16px;pointer-events:none}
.modal .card{pointer-events:auto;max-width:520px;width:100%;max-height:90vh;overflow:auto}
.home{max-width:760px;margin:40px auto;padding:20px;display:flex;flex-direction:column;gap:24px}
  </style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------- helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const DOW=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MON=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fmtLong=s=>{const d=parse(s);return `${cap(DOW[d.getDay()])} ${d.getDate()} de ${MON[d.getMonth()]}`};
const fmtShort=s=>{const d=parse(s);return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${String(d.getFullYear()).slice(2)}`};
const nowHM=()=>{const d=new Date();return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hh=str=>{let h=7;for(const c of str)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};
const TODAY=iso(new Date());
const nextWeekday=(from,n)=>{let d=parse(from),c=0;while(c<n){d=addDays(d,1);if(d.getDay()%6)c++}return iso(d)};
const initials=n=>n.split(/[ ,]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const age=nac=>{const b=parse(nac),t=new Date();let a=t.getFullYear()-b.getFullYear();if(t<new Date(t.getFullYear(),b.getMonth(),b.getDate()))a--;return a};
const $=id=>document.getElementById(id);
const val=id=>($(id)?.value||'').trim();

const I={
  tooth:'<svg class="ico" viewBox="0 0 24 24"><path d="M7 3c-2.5 0-4 2-4 4.5 0 3 1.5 4.5 2 7.5.4 2.6 1 6 2.5 6s1.8-3 2.5-5.5c.3-1 1.7-1 2 0 .7 2.5 1 5.5 2.5 5.5s2.1-3.4 2.5-6c.5-3 2-4.5 2-7.5C21 5 19.5 3 17 3c-2 0-3 1-5 1S9 3 7 3z"/></svg>',
  cal:'<svg class="ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  clip:'<svg class="ico" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/></svg>',
  queue:'<svg class="ico" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  bell:'<svg class="ico" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></svg>',
  arrow:'<svg class="ico" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  back:'<svg class="ico" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
  out:'<svg class="ico" viewBox="0 0 24 24"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>',
  warn:'<svg class="ico" viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg>',
  check:'<svg class="ico" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>',
  msg:'<svg class="ico" viewBox="0 0 24 24"><path d="M4 20l1.5-4A8 8 0 1 1 9 19.5z"/></svg>',
};

/* ---------- data ---------- */
const PROFS=[
  {id:'L',nombre:'Dra. Martina López',esp:'Odontología general',mat:'M.N. 38.457',box:'Consultorio 2',dias:[1,2,3,4,5],tipos:['Consulta y revisión','Limpieza','Urgencia']},
  {id:'D',nombre:'Dr. Martín Domínguez',esp:'Ortodoncia',mat:'M.N. 41.203',box:'Consultorio 1',dias:[1,3,5],tipos:['Consulta y revisión','Control de ortodoncia']},
  {id:'S',nombre:'Dra. Lucía Saccone',esp:'Endodoncia',mat:'M.N. 36.880',box:'Consultorio 3',dias:[2,4],tipos:['Consulta y revisión','Tratamiento de conducto','Urgencia']},
];
const TIPOS=['Consulta y revisión','Limpieza','Urgencia','Control de ortodoncia','Tratamiento de conducto'];
const TIMES=['09:00','09:30','10:00','10:30','11:00','11:30','14:00','14:30','15:00','15:30','16:00','16:30'];
const ALERT_CONDS=['Problemas cardíacos','Problemas de coagulación','Alergia al látex','Diabetes','Epilepsia','Presión sanguínea alta','Hepatitis'];

function seed(){
  const d2=nextWeekday(TODAY,2);
  return {
    patients:[
      {id:'p1',hc:'HC-2024-001',nombre:'Gutiérrez, María Paz',dni:'44122123',nac:'2002-03-14',tel:'+54 9 351 555-1234',email:'mpgutierrez@correo.com',dom:'Av. Colón 1234, 3° B',loc:'Córdoba',os:'Particular / Sin obra social',afil:'',ocup:'Estudiante',conds:['Problemas de coagulación'],alergia:'Penicilina',meds:'No',fuma:'No'},
      {id:'p2',hc:'HC-2023-118',nombre:'Saccone, Facundo',dni:'38647762',nac:'1994-08-02',tel:'+54 9 351 612-0098',email:'fsaccone@correo.com',dom:'Bv. San Juan 410',loc:'Córdoba',os:'OSDE',afil:'61234567/01',ocup:'Docente',conds:[],alergia:'No',meds:'No',fuma:'Sí'},
      {id:'p3',hc:'HC-2024-047',nombre:'Lombardi, Rocío',dni:'40155234',nac:'1997-11-21',tel:'+54 9 351 700-4410',email:'rlombardi@correo.com',dom:'Obispo Trejo 255',loc:'Córdoba',os:'Apross',afil:'2045519',ocup:'Diseñadora',conds:['Presión sanguínea alta'],alergia:'No',meds:'Enalapril',fuma:'No'},
      {id:'p4',hc:'HC-2022-310',nombre:'Márquez, Elena',dni:'35012987',nac:'1990-05-09',tel:'+54 9 351 433-2871',email:'emarquez@correo.com',dom:'Rondeau 88',loc:'Córdoba',os:'Swiss Medical',afil:'SM-883201',ocup:'Contadora',conds:[],alergia:'No',meds:'No',fuma:'No'},
      {id:'p5',hc:'HC-2021-022',nombre:'Pereyra, Juan Carlos',dni:'30111222',nac:'1983-01-30',tel:'+54 9 351 389-5520',email:'jcpereyra@correo.com',dom:'Av. Vélez Sarsfield 1500',loc:'Córdoba',os:'PAMI',afil:'150334229',ocup:'Comerciante',conds:['Diabetes'],alergia:'No',meds:'Metformina',fuma:'No'},
    ],
    turnos:[
      {id:'T-4821',pac:'p1',prof:'L',fecha:TODAY,hora:'10:30',tipo:'Consulta y revisión',estado:'confirmado'},
      {id:'T-4815',pac:'p2',prof:'L',fecha:TODAY,hora:'09:00',tipo:'Limpieza',estado:'confirmado'},
      {id:'T-4817',pac:'p3',prof:'L',fecha:TODAY,hora:'09:30',tipo:'Urgencia',estado:'confirmado'},
      {id:'T-4830',pac:'p4',prof:'D',fecha:d2,hora:'11:00',tipo:'Control de ortodoncia',estado:'confirmado'},
    ],
    cola:[
      {id:'c1',pac:'p2',turno:'T-4815',prof:'L',llegada:'08:52',estado:'espera'},
      {id:'c2',pac:'p3',turno:'T-4817',prof:'L',llegada:'09:14',estado:'espera'},
    ],
    salida:[],
    hc:[
      {pac:'p1',fecha:'2026-08-20',prof:'D',motivo:'Control de ortodoncia',piezas:'13, 23',proc:'Ajuste de arco',diag:'Evolución favorable',notas:'Sin dolor. Próximo control en 4 semanas.'},
      {pac:'p1',fecha:'2026-07-16',prof:'D',motivo:'Control de ortodoncia',piezas:'—',proc:'Cambio de ligaduras',diag:'Sin novedades',notas:'Refuerzo de higiene interproximal.'},
      {pac:'p1',fecha:'2026-05-02',prof:'L',motivo:'Consulta y revisión',piezas:'36',proc:'Obturación compuesta clase I',diag:'Caries oclusal',notas:'Se trabajó con hemostasia local por antecedente de coagulación.'},
      {pac:'p2',fecha:'2026-04-11',prof:'L',motivo:'Limpieza',piezas:'—',proc:'Tartrectomía y pulido',diag:'Gingivitis leve',notas:'Indicar cepillo suave.'},
      {pac:'p5',fecha:'2026-09-30',prof:'S',motivo:'Tratamiento de conducto',piezas:'46',proc:'Endodoncia 1° sesión',diag:'Pulpitis irreversible',notas:'Medicación intraconducto. Paciente diabético: control de glucemia previo.'},
    ],
    wa:[],
  };
}

/* ---------- state ---------- */
let S;
function reset(){
  S={...seed(),view:'o.login',toast:null,modal:null,
     oUser:'L',_oIn:false,
     offer:null, att:null, hcq:'', viewPac:null};
}
reset();
const pac=id=>S.patients.find(p=>p.id===id);
const prof=id=>PROFS.find(p=>p.id===id);
const turno=id=>S.turnos.find(t=>t.id===id);
const nextTurnoOf=pid=>S.turnos.filter(t=>t.pac===pid&&t.estado==='confirmado'&&t.fecha>=TODAY).sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora))[0];
const newTurnoId=()=>'T-'+(4831+S.turnos.length+Math.floor(Math.random()*9));

function slotsFor(pid,date){
  const p=prof(pid),d=parse(date);
  if(!p.dias.includes(d.getDay())) return [];
  if(date<TODAY) return [];
  return TIMES.filter(t=>hh(pid+date+t)%3!==0
    && !S.turnos.some(x=>x.prof===pid&&x.fecha===date&&x.hora===t&&x.estado!=='cancelado')
    && !(date===TODAY && t<=nowHM()));
}
function offerSlots(pid,page){
  const out=[];let d=addDays(parse(TODAY),1);
  for(let i=0;i<90&&out.length<(page+1)*3;i++,d=addDays(d,1)){
    const s=iso(d),sl=slotsFor(pid,s);
    if(sl.length) out.push({fecha:s,hora:sl[hh(s)%sl.length]});
  }
  return out.slice(page*3,page*3+3);
}
function queueFor(pid){return S.cola.filter(c=>c.prof===pid&&c.estado!=='finalizado')}
function queuePos(c){
  const q=S.cola.filter(x=>x.prof===c.prof&&x.estado==='espera');
  const pos=q.findIndex(x=>x.id===c.id)+1;
  const busy=S.cola.some(x=>x.prof===c.prof&&x.estado==='atendiendo');
  return {pos,wait:(pos-1)*30+(busy?20:0)};
}
function sendWA(p,t){
  const pr=prof(t.prof);
  const first=p.nombre.split(',')[1]?.trim().split(' ')[0]||p.nombre;
  const text=`Consultorio Odontológico\nHola ${first}, tu turno quedó CONFIRMADO.\n\n${fmtLong(t.fecha)} · ${t.hora} h\n${pr.nombre} · ${t.tipo}\nSede Centro\nCódigo: ${t.id}`;
  const m={to:p.tel,text,at:nowHM(),pac:p.id};
  S.wa.push(m);return m;
}

  ${a.length?`<div class="alert">${I.warn}<div><b>Alerta médica</b><p>${esc(a.join(' · '))}</p></div></div>`:''}
  <div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th>Profesional</th><th>Motivo</th><th>Piezas</th><th>Procedimiento</th><th></th></tr></thead><tbody>
  ${hist.map((h,i)=>`<tr><td class="num mono">${fmtShort(h.fecha)}</td><td>${prof(h.prof).nombre}</td><td>${esc(h.motivo)}</td><td class="mono">${esc(h.piezas)}</td><td>${esc(h.proc)}<br><span class="muted small">${esc(h.diag)}</span></td><td><button class="btn sm" data-a="hc-det" data-pac="${p.id}" data-i="${i}">Detalle</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">Sin registros.</td></tr>'}
  </tbody></table></div>
  <p class="muted small">Los registros de historia clínica no se eliminan. Para corregir uno, se agrega una nueva entrada que lo rectifica.</p>`;
}

function saveAtt(){if(!$('at-proc'))return;Object.assign(S.att,{motivo:val('at-motivo'),proc:val('at-proc'),diag:val('at-diag'),ind:val('at-ind'),notas:val('at-notas')})}

/* ---------- actions ---------- */
const A={
  nav(d){S.view=d.v;window.scrollTo(0,0)},
  'close-modal'(){S.modal=null},
  'o-enter'(d){S.oUser=d.id;S._oIn=true;S.view='o.queue'},
  logout(){S._oIn=false;S.view='o.login'},
  'o-call'(d){const c=S.cola.find(x=>x.id===d.id);c.estado='atendiendo';c.llamado=nowHM();S.att={cola:c.id,teeth:[]};S.offer=null;S.view='o.patient';toast(`Llamando a ${pac(c.pac).nombre} a ${prof(c.prof).box}`);window.scrollTo(0,0)},
  'o-open'(d){if(!S.att||S.att.cola!==d.id)S.att={cola:d.id,teeth:[]};S.view=S.att.saved?'o.next':'o.patient'},
  'o-recall'(){toast('Se volvió a anunciar al paciente en la sala')},
  'o-start'(){S.view='o.attend';window.scrollTo(0,0)},
  'o-hcp'(d){S.viewPac=d.id;S.view='o.hcp'},
  tooth(d){const n=+d.n,a=S.att.teeth;const i=a.indexOf(n);i<0?a.push(n):a.splice(i,1);a.sort((x,y)=>x-y);saveAtt()},
  'o-need'(d){const c=S.cola.find(x=>x.id===S.att.cola);S.att.need=d.v==='1';if(S.att.need)startOffer(c.pac,c.prof)},
  'o-quit'(){
    const c=S.cola.find(x=>x.id===S.att.cola);c.estado='finalizado';const t=turno(c.turno);if(t)t.estado='atendido';
    const nt=S.offer&&S.offer.result?turno(S.offer.result):null;
    S.salida.push({id:'s'+Date.now(),pac:c.pac,prof:c.prof,salida:nowHM(),turnoNuevo:nt?`${fmtLong(nt.fecha)} · ${nt.hora} h (${nt.id})`:null});
    S.cola=S.cola.filter(x=>x.id!==c.id);
    S.att=null;S.offer=null;S.view='o.queue';toast('Paciente quitado de la cola.');
  },
  'offer-accept'(d){
    const o=S.offer,p=pac(o.pac);const t={id:newTurnoId(),pac:p.id,prof:o.prof,fecha:d.f,hora:d.h,tipo:o.tipo,estado:'confirmado'};
    S.turnos.push(t);sendWA(p,t);o.result=t.id;
    toast('Turno asignado.');
  },
  'offer-reject'(){S.offer.asking=true},
  'offer-more'(){S.offer.asking=false;S.offer.page++},
  'offer-stop'(){S.offer.asking=false;S.offer.ended=true},
  'hc-det'(d){const hist=S.hc.filter(h=>h.pac===d.pac).sort((a,b)=>b.fecha.localeCompare(a.fecha));S.modal={type:'hcdet',h:hist[+d.i]}},
};

/* ---------- forms ---------- */
const F={
  'o-hc'(){
    saveAtt();const a=S.att;if(!a.proc){a.err=true;return}a.err=false;
    const c=S.cola.find(x=>x.id===a.cola);
    S.hc.push({pac:c.pac,fecha:TODAY,prof:c.prof,motivo:a.motivo,piezas:a.teeth.length?a.teeth.join(', '):'—',proc:a.proc,diag:a.diag||'—',notas:[a.notas,a.ind&&('Indicaciones: '+a.ind)].filter(Boolean).join(' ')||'—'});
    a.saved=true;S.view='o.next';toast('Historia clínica actualizada');window.scrollTo(0,0);
  },
};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const fn=A[el.dataset.a];if(!fn)return;e.preventDefault();
  if(S.view==='o.attend'&&el.dataset.a!=='tooth')saveAtt();
  const r=fn(el.dataset,el);if(r!==false)render();
});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();F[f.dataset.form]?.();render()});
document.addEventListener('change',e=>{
  const k=e.target.dataset.change;if(!k)return;
  if(k==='offer-prof'){S.offer.prof=e.target.value;S.offer.page=0;S.offer.tipo=prof(e.target.value).tipos[0]}
  if(k==='offer-tipo'){S.offer.tipo=e.target.value}
  render();
});
document.addEventListener('input',e=>{
  const k=e.target.dataset.input;if(!k)return;S[k]=e.target.value;
  const pos=e.target.selectionStart;const id=e.target.id;render();const el=$(id);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(_){}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal){S.modal=null;render()}});
render();
</script>
</body>
</html>
